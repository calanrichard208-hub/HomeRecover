name: tests
on: [push, pull_request]
jobs:
  trend-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run trend engine tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
